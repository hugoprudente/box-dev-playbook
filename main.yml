---
- name: Configure SRE Box
  hosts: all
  gather_facts: True

  vars_files:
    - default.config.yml

  pre_tasks:
    - name: Include overwrite setup from environment
      ansible.builtin.include_vars: "{{ item }}"
      with_fileglob:
        - "{{ playbook_dir }}/config.yml"
      tags: ['always']

  roles:
    - role: common
      tags: ['always']

    - role: elliotweiser.osx-command-line-tools
      when: ansible_os_family == "Darwin"
      tags: ['osx-ctl', 'osx', 'base']
    - role: geerlingguy.mac.homebrew
      when:
        - ansible_os_family == "Darwin"
        - ansible_distribution == 'MacOSX'
      tags: ['homebrew', 'osx', 'base']
    - role: geerlingguy.mac.mas
      when: (mas_installed_apps or mas_installed_app_ids) and ansible_os_family == "Darwin"
      tags: ['mas', 'osx', 'base']
    - role: geerlingguy.mac.dock
      when: configure_dock and ansible_os_family == "Darwin"
      tags: ['dock', 'osx', 'base']

    # Debian based Specific
    - role: apt
      when: ansible_os_family == "Debian"
      tags: ['apt', 'base']

    # RedHat based specifics
    - role: dnf
      when: ansible_os_family == "RedHat"
      tags: ['dnf', 'base']

    - role: ides
      when: configure_ides
      tags: ['ides', 'base']

    - role: dotfiles
      when: configure_dotfiles
      become: false
      tags: ['dotfiles']

    - role: containerization
      when: configure_containerization
      tags: ['containerization', 'containers']

    # Tools, venvs, command lines and much more
    - role: kubernetes
      when: configure_kubernetes
      tags: ['kubernetes', 'k8s']

    - role: languages
      when: configure_languages
      tags: ['languages']

    - role: ai
      when: configure_ai
      become: false
      tags: ['ai']

    - role: andrewrothstein.terraform
      when: configure_terraform
      tags: ['terraform', 'iac']

    - role: remote-vpn
      when: configure_remote_vpn
      become: true
      tags: ['remote-vpn', 'network']
  tasks:
    - name: Install extra packages
      import_tasks: tasks/extra-packages.yml
      tags: ['extra-packages']

    - name: Run post-provision task files in a block.
      tags: ['post']
      block:
        - name: Run configured post-provision ansible task files.
          include_tasks: "{{ outer_item }}"
          loop_control:
            loop_var: outer_item
          with_fileglob: "{{ post_provision_tasks | default(omit) }}"
