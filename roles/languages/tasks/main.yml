---
- name: Install configured languages
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/{{ lang.name }}/main.yml"
  loop: "{{ languages }}"
  loop_control:
    loop_var: lang

- name: Add the default Python venv to every login shell PATH
  become: true
  ansible.builtin.template:
    src: box-dev-venv.sh.j2
    dest: /etc/profile.d/box-dev-venv.sh
    owner: root
    group: root
    mode: "0644"
  when:
    - languages_python_profile_d
    - languages_python_default_venv is defined
