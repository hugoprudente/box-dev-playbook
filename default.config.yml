---
downloads: ~/.ansible-downloads/

configure_dotfiles: true

# Set to 'true' to configure the Dock via dockutil.
configure_dock: true
dockitems_remove: []
# - Launchpad
# - TV
# - Podcasts
# - 'App Store'
dockitems_persist:
  - name: "VSCodium"
    path: "/Applications/VSCodium.app/"
    pos: 5
  - name: "Iterm"
    path: "/Applications/Iterm.app"
    pos: 6

configure_sudoers: false
sudoers_custom_config: ''
# Example:
# sudoers_custom_config: |
#   # Allow users in admin group to use sudo with no password.
#   %admin ALL=(ALL) NOPASSWD: ALL

dotfiles_repo: https://github.com/hugoprudente/dotfiles.git
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination_basepath: ~/code/github.com/hugoprudente
dotfiles_repo_local_destination: "{{ dotfiles_repo_local_destination_basepath }}/dotfiles"

# Dotfiles configs mapping
dotfiles_files:
  - orig: bashrc
    dest: .bashrc
  - orig: nvim
    dest: .config/nvim
  - orig: tmux/tmux.conf
    dest: .tmux.conf
  - orig: tmux/tmux.conf.local
    dest: .tmux.conf.local
  - orig: starship.toml
    dest: .config/starship.toml

# Homebrew
homebrew_taps:
  - homebrew/core
  - homebrew/cask

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - rectangle
  - vscodium
  - iterm2

homebrew_installed_packages:
  - mas
  - pv
  - bat
  - starship
  - direnv
  - htop
  - gpg
  - openssl
  - make
  - neovim
  - ripgrep
  - node # used by neovim
  - tmux
  - vault
  - yq
  - jq
  - graphviz
  - podman
  - qemu
  - coreutils
  - json-c

# See `geerlingguy.mas` role documentation for usage instructions.
# mas_email: ""
# mas_password: ""
mas_signin_dialog: true
mas_installed_apps:
  - {id: 425264550, name: "Blackmagic Disk Speed Test (3.0)"}
  - {id: 497799835, name: "Xcode (8.1)"}

# Install packages from other package managers.
# Note: You are responsible for making sure the required package managers are
# installed, eg. through homebrew.
composer_packages: []
# - name: drush
#   state: present # present/absent, default: present
#   version: "^8.1" # default: N/A
gem_packages: []
# - name: bundler
#   state: present # present/absent/latest, default: present
#   version: "~> 1.15.1" # default: N/A
npm_packages: []
# - name: webpack
#   state: present # present/absent/latest, default: present
#   version: "^2.6" # default: N/A
pip_default_state: present
# Prefer the path set by the languages role (OS-resolved version). Fallback
# below is only used when languages did not run.
pip_default_executable: "{{ languages_python_pip_executable | default(ansible_user_dir ~ '/venv/python3.12/bin/pip') }}"
pip_packages:
  - ansible-core
  - ansible-lint
  - python-openstackclient
  - python-octaviaclient

# Glob pattern to ansible task files to run after all other tasks are finished.
post_provision_tasks: []

# APT
# Note: direnv + starship are not in default Ubuntu/Debian repos;
# common role installs them via official scripts / GitHub binaries.
apt_installed_packages:
  - pv
  - bat
  - bash-completion
  - make
  - neovim
  - htop
  - ripgrep
  - tmux
  - unzip
  - git

# DNF
# Note: direnv + starship are not in default CentOS/RHEL repos;
# common role installs them via official scripts / GitHub binaries.
dnf_installed_packages:
  - tmux
  - htop
  - bash-completion
  - make
  - neovim
  - unzip
  - git


# Shell configuration
dotfiles_configure_ohmyzsh: false
dotfiles_configure_bashit: false
dotfiles_configure_starship: true

# Shell tools
configure_funcoeszz: false
funcoeszz_version: "21.1"

# Kubernetes
configure_kubernetes: true

# K8S Extra CLIs
kubernetes_extra_clis:
  - helm
  - krew
  - argocd
  - cilium
  - velero

# Krew plugins
krew_plugins:
  - ctx
  - ns

# Containerization
configure_containerization: true
containerization_engine: podman

# Languages
# Python venvs live at ~/venv/python<version> for the targeted SSH user.
# Same version re-run upgrades the venv; a new version creates a new directory.
# version may be a string or a per-ansible_os_family map.
configure_languages: true
languages_venv_dirname: venv
languages:
  - name: python
    version:
      Debian: "3.9"
      RedHat: "3.11"
      Darwin: "3.12"
      default: "3.12"
    packages: []
    extra_packages:
      # Keep package names aligned with the OS-specific version above.
      dnf:
        - python3.11-numpy
      apt:
        - python3.12-numpy
  - name: go
    version: "1.17+"

# AI
configure_ai: true
ai_pip_packages:
  - torch
  - torchvision
  - transformers
  - open-webui
ai_ollama_models:
  - deepseek-r1:1.5b

#Terraform
configure_terraform: false
