---
configure_languages: false

# Target user that owns the versioned venvs (the personal/SSH user).
# With inventory ansible_become=true, tasks must become_user back to this account.
languages_user: "{{ ansible_user | default(ansible_user_id) }}"

# Directory name under the target user's home. Each Python version gets its own
# venv: ~/venv/python3.12 — same version re-run upgrades packages; new version
# creates a sibling directory (like devenv).
languages_venv_dirname: venv

# Packages always installed/upgraded into every Python venv on each run.
languages_python_venv_packages:
  - pip
  - wheel
  - setuptools

# Drop /etc/profile.d so login shells prepend the default Python venv to PATH.
languages_python_profile_d: true

languages: []
